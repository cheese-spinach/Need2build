name: Fetch Twitter Signals

on:
  schedule:
    # 每天 UTC 时间 00:00 运行（北京时间 8:00）
    - cron: '0 0 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Twitter signals
        env:
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        run: python scripts/fetch_twitter.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "Need2Build Bot"
          git config --global user.email "need2build-bot@users.noreply.github.com"
          git add data/twitter_signals.json
          git diff --staged --quiet || git commit -m "Update Twitter signals $(date +'%Y-%m-%d')"
          git push
